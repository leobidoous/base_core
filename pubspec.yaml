name: base_core
description: Um package auxiliar para manter as dependências globais de um aplicativo multi-repositório e mono-repositório.
homepage: https://www.github.com/leobidoous
repository: https://www.github.com/leobidoous/base_core
issue_tracker: https://www.github.com/leobidoous/base_core/issues
version: 1.5.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  #===== Firebase depedencies ===================
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_database: ^12.6.0
  firebase_messaging: ^16.7.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  firebase_remote_config: ^6.7.0
  firebase_in_app_messaging: ^0.9.4
  #==============================================

  #===== New dependecies for new app flutter =====
  dio: ^5.11.1
  intl: ^0.20.2
  rxdart: ^0.28.0
  equatable: ^3.0.0
  local_auth: ^3.0.2
  share_plus: ^13.3.0
  geolocator: ^14.0.2
  path_provider: ^2.1.6
  local_auth_darwin: ^2.0.3
  connectivity_plus: ^7.3.1
  package_info_plus: ^10.2.1
  shared_preferences: ^2.5.5
  local_auth_android: ^2.2.0
  permission_handler: ^13.0.2
  flutter_secure_storage: ^11.2.0
  mask_text_input_formatter: ^2.9.0
  flutter_local_notifications: ^22.3.1
  #==============================================

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
