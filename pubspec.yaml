name: base_core
description: Um package auxiliar para manter as dependências globais de um aplicativo multi-repositório e mono-repositório.
homepage: https://www.github.com/leobidoous
repository: https://www.github.com/leobidoous/base_core
issue_tracker: https://www.github.com/leobidoous/base_core/issues
version: 1.7.1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  #===== Firebase depedencies ===================
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  firebase_database: ^13.0.1
  firebase_messaging: ^17.0.1
  firebase_analytics: ^13.0.1
  firebase_crashlytics: ^6.0.1
  firebase_remote_config: ^7.0.1
  firebase_in_app_messaging: ^0.10.1
  #==============================================

  #===== New dependecies for new app flutter =====
  dio: ^5.11.1
  intl: ^0.20.2
  rxdart: ^0.28.0
  equatable: ^3.0.0
  local_auth: ^3.0.2
  share_plus: ^13.3.1
  geolocator: ^14.1.1
  path_provider: ^2.1.6
  local_auth_darwin: ^2.0.3
  connectivity_plus: ^7.3.1
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.6
  local_auth_android: ^2.2.0
  permission_handler: ^13.0.2
  flutter_secure_storage: ^11.2.0
  mask_text_input_formatter: ^2.9.0
  flutter_local_notifications: ^22.3.2
  #==============================================

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
